name: C++

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: build
      run: g++ -O3 -std=c++20 -o WordleCpp src/*.cpp src/**/*.cpp -Iinclude
      working-directory: WordleCpp
